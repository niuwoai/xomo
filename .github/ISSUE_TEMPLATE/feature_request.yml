name: Feature request
description: Suggest a capability, a new automation tool, or a gap worth closing.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        **English or 中文 both fine, use whichever you are comfortable in.**

        Before filing: [`PHOTOSHOP_CLASSIC_ROADMAP.md`](https://github.com/niuwoai/xomo/blob/main/PHOTOSHOP_CLASSIC_ROADMAP.md)
        and [`XOMO_UI_DESIGN_ROADMAP.md`](https://github.com/niuwoai/xomo/blob/main/XOMO_UI_DESIGN_ROADMAP.md)
        list the known gaps in priority order. If your idea is already there, a 👍 on this issue plus a note on
        *why it matters to your workflow* is more useful than a new issue.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this?
      options:
        - A new automation tool (MCP / CLI)
        - A new UI component family or theme pack
        - An editing capability (tool, filter, adjustment, selection)
        - PSD / Figma / SVG import-export fidelity
        - Translating the docs into another language
        - Developer experience (build, tests, docs, CI)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem you are actually trying to solve
      description: Describe the workflow, not just the feature. What are you doing today, and where does it break down?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like Xomo to do
      description: If it is an automation tool, sketch the tool name and its JSON arguments.
      placeholder: |
        xomo call xomo.layer.style '{"action":"presetApply","id":"<preset-id>"}'
    validations:
      required: true

  - type: input
    id: reference
    attributes:
      label: How does Photoshop (or another editor) do it?
      description: Optional but valuable — it sets the expected behaviour precisely.
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: A manual workaround tells us how much this hurts.
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - label: I am willing to open a PR for this (see CONTRIBUTING.md — the automation registry is deliberately one file).
          required: false
